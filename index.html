function allocation(income,actualExpense,cash,plannedLiving){
  income=+income||0; actualExpense=+actualExpense||0; cash=+cash||0; plannedLiving=+plannedLiving||0;
  const target=70000,gap=Math.max(0,target-cash),available=Math.max(0,income-plannedLiving);
  if(income<=0)return{available:0,emergency:0,core:0,flex:0,gap,stage:'尚未啟動'};

  let emergency=0,core=0,flex=0,stage='安全墊建置期';

    emergency=Math.min(gap,Math.round(available*0.30));
    core=Math.round(available*0.55);
    flex=Math.max(0,available-emergency-core);
  }else{
    stage='穩定投資期';
    core=Math.min(17000,Math.round(available*0.80));
    flex=Math.max(0,available-core);
  }
  if(flex<2000&&available>=2000){const need=2000-flex,shift=Math.min(core,need);core-=shift;flex+=shift}
  return{available,emergency,core,flex,gap,stage};
}

async function setupDefaultCards(){
  if(!u)return alert('請先登入');
  const issuers=['台新','富邦','國泰'];
  for(const issuer of issuers){
    let exists=(await q('credit_cards',{order:'created_at'})).find(x=>x.issuer===issuer);
    if(exists)continue;
    let {error}=await c.from('credit_cards').insert({
      user_id:u.id,issuer,card_name:issuer+'信用卡',
      statement_balance:0,paid_amount:0,current_spend:0,monthly_spend_cap:0,payment_status:'使用中'
    });
    if(error){alert('建立 '+issuer+' 失敗：'+error.message);return}
  }
  creditCards();
}
async function createOneCard(issuer){
  if(!u)return alert('請先登入');

  let {error}=await c.from('credit_cards').insert({

    statement_balance:0,paid_amount:0,current_spend:0,monthly_spend_cap:0,payment_status:'使用中'

}

async function addCardSpend(){

  if(!d||!issuer||amt<=0)return alert('請填日期、卡片與金額');

  let {error}=await c.from('finance_entries').insert({
    user_id:u.id,entry_date:d,month:month+'-01',entry_type:'expense',category:cat,
    amount:amt,payment_method:issuer,note,updated_at:new Date().toISOString()

v class="course-step"><div class="num">03 · RISK</div><h3>風險：我到底承擔什麼？</h3><p class="muted">集中、產業循環、利率、流動性與估值風險。</p></div><div class="course-step"><div class="num">04 · EVIDENCE</div><h3>Fact ≠ Analysis</h3><p class="muted">把可驗證資料與自己的推論分開，避免自我說服。</p></div><div class="course-step"><div class="num">05 · ALLOCATION</div><h3>資產配置</h3><p class="muted">先現金流與預備金，再決定股票、ETF、債券與現金比例。</p></div><div class="course-step"><div class="num">06 · 1M</div><h3>第一個 100 萬</h3><p class="muted">把收入、儲蓄率、持續投入與投資報酬串成可追蹤系統。</p></div><div class="course-step"><div class="num">07 · REVIEW</div><h3>投資複盤</h3><p class="muted">每月回頭檢查：當初的 Fact、Analysis、Risk 有沒有被新資料推翻。</p></div></div></section>`}

async function saveGoal(){
  try{
    const n=setGoalValue($('goalInput').value);
    if(u&&c){
      const {error}=await c.from('profiles').upsert({user_id:u.id,savings_goal:n,updated_at:new Date().toISOString()},{onConflict:'user_id'});
      if(error)throw error;
    }
    render();
  }catch(e){alert('儲存目標失敗：'+(e?.message||'請輸入有效的正數目標。'))}
}
async function resetGoal(){
  try{
    setGoalValue(DEFAULT_GOAL);
    if(u&&c){
      const {error}=await c.from('profiles').upsert({user_id:u.id,savings_goal:DEFAULT_GOAL,updated_at:new Date().toISOString()},{onConflict:'user_id'});
      if(error)throw error;
    }
    render();
  }catch(e){alert('恢復目標失敗：'+(e?.message||''))}
}
async function login(mode){let e=$('e').value,p=$('p').value,z=mode?await c.auth.signUp({email:e,password:p}):await c.auth.signInWithPassword({email:e,password:p});if(z.error)return alert(z.error.message);u=z.data.user;if(mode&&!z.data.session)return alert('帳號已建立，若啟用 Email Confirmation 請先完成驗證。');status('雲端同步中','#059669');await seed();render()}async function seed(){let {data}=await c.from('tasks').select('id').limit(1);if(data?.length)return;let titles=['建立 2026/09 資產 Baseline','完成台股／美股／利率／景氣研究','完成 0050 深度研究','建立台股全市場研究框架','確定 11 月投資執行規則','完成本月投資課','建立投資決策紀錄格式','完成 9 月月度複盤'];await c.from('tasks').insert(titles.map((title,i)=>({user_id:u.id,month:'2026-09-01',task_key:'sep_'+(i+1),title,priority:i<5?'P0':'P1',status:'todo'})))}function showLogin(){$('app').innerHTML=`<div class="card" style="max-width:520px;margin:50px auto"><div class="eyebrow" style="color:var(--blue)">WELCOME TO MILLIONPROJECT.</div><h2>登入你的投資作戰系統</h2><p class="muted">手機與電腦使用同一帳號即可同步財務、研究與決策。</p><div class="field"><label>Email</label><input id="e" type="email"></div><div class="field" style="margin-top:9px"><label>Password</label><input id="p" type="password"></div><div class="actions"><button class="btn main" onclick="login(0)">登入</button><button class="btn soft" onclick="login(1)">建立帳號</button></div></div>`}async function render(){nav();if(!u)return showLogin();if(tab==='o')return overview();if(tab==='m')return monthly();if(tab==='c')return creditCards();if(tab==='p')return portfolio();if(tab==='r')return marketResearch();if(tab==='d')return decisions();if(tab==='l')return learning();return settings()}async function logout(){await c.auth.signOut();location.reload()}async function init(){try{c=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let z=await c.auth.getUser();u=z.data.user||null;status(u?'雲端同步中':'尚未登入',u?'#059669':'#b45309');if(u){await seed();await loadCloudGoal()}render()}catch(e){status('連線失敗','#dc2626');showLogin()}}init();
</script></body></html>
