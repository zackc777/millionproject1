async function moneyEngine(targetMonth){
  const month=monthKey(targetMonth)||new Date().toISOString().slice(0,7);
  const all=(await q('finance_entries',{order:'entry_date'})).filter(isRealFinanceEntry);
  const upto=all.filter(x=>monthKey(x.month)<=month);
  const current=all.filter(x=>monthKey(x.month)===month);
  const sum=(arr,type,filterFn)=>arr.filter(x=>x.entry_type===type&&(!filterFn||filterFn(x))).reduce((n,x)=>n+(+x.amount||0),0);
  const monthIncome=sum(current,'income'), monthExpense=sum(current,'expense'), monthSaving=sum(current,'saving'), monthInvestment=sum(current,'investment');
  const totalIncome=sum(upto,'income'), totalExpense=sum(upto,'expense'), totalSaving=sum(upto,'saving'), totalInvestment=sum(upto,'investment');
  const emergency=sum(upto,'saving',x=>String(x.category||'').includes('緊急預備金'));
  const otherSaving=Math.max(0,totalSaving-emergency);
  const liquidCash=totalIncome-totalExpense-totalSaving-totalInvestment;
  const holdings=await q('portfolio',{order:'updated_at'});
  const portfolioCost=holdings.reduce((n,x)=>n+(+x.quantity||0)*(+x.avg_cost||0),0);
  const portfolioValue=holdings.reduce((n,x)=>{
    const v=+x.current_value||((+x.quantity||0)*(+x.current_price||0))||((+x.quantity||0)*(+x.avg_cost||0));
    return n+v;
  },0);
  const untrackedInvestment=Math.max(0,totalInvestment-portfolioCost);
  const investmentValue=portfolioValue+untrackedInvestment;
  const cashLike=liquidCash+emergency+otherSaving;
  const totalAssets=cashLike+investmentValue;
  const monthUnallocated=monthIncome-monthExpense-monthSaving-monthInvestment;
  return {month,current,monthIncome,monthExpense,monthSaving,monthInvestment,totalIncome,totalExpense,totalSaving,totalInvestment,emergency,otherSaving,liquidCash,cashLike,portfolioCost,portfolioValue,untrackedInvestment,investmentValue,totalAssets,monthUnallocated};
}

function allocation(income,actualExpense,cash,plannedLiving){

  const target=70000,gap=Math.max(0,target-cash),available=Math.max(0,income-plannedLiving);

  return{available,emergency,core,flex,gap,stage};
}

async function setupDefaultCards(){
  if(!u)return alert('請先登入');
  const issuers=['台新','富邦','國泰'];
  for(const issuer of issuers){
    let exists=(await q('credit_cards',{order:'created_at'})).find(x=>x.issuer===issuer);
    if(exists)continue;
    let {error}=await c.from('credit_cards').insert({
      user_id:u.id,issuer,card_name:issuer+'信用卡',
      statement_balance:0,paid_amount:0,current_spend:0,monthly_spend_cap:0,payment_status:'使用中'
    });
    if(error){alert('建立 '+issuer+' 失敗：'+error.message);return}
  }
  creditCards();
}
async function createOneCard(issuer){
  if(!u)return alert('請先登入');
  let name=prompt(`${issuer}卡片名稱（只需要設定一次）`,issuer+'信用卡');
  if(name===null)return;
  let {error}=await c.from('credit_cards').insert({
    user_id:u.id,issuer,card_name:name||issuer+'信用卡',
    statement_balance:0,paid_amount:0,current_spend:0,monthly_spend_cap:0,payment_status:'使用中'
  });
  if(error)return alert(error.message);
  creditCards();
}
async function editCardOnce(id,issuer){
  let name=prompt(`${issuer}卡片名稱`);
  if(name===null)return;
  await update('credit_cards',id,{card_name:name||issuer+'信用卡'});
  creditCards();
}
async function addCardSpend(){
  if(!u)return alert('請先登入');
  const d=$('ccd')?.value,issuer=$('cci')?.value,cat=$('ccc')?.value,amt=+$('cca')?.value||0,note=$('ccn')?.value.trim()||'';
  if(!d||!issuer||amt<=0)return alert('請填日期、卡片與金額');
  const month=d.slice(0,7);
  let {error}=await c.from('finance_entries').insert({
    user_id:u.id,entry_date:d,month:month+'-01',entry_type:'expense',category:cat,
    amount:amt,payment_method:issuer,note,updated_at:new Date().toISOString()
  });

  let cur=(await q('finance_entries',{order:'entry_date'})).filter(x=>(x.month||'').slice(0,7)===month);

}

v class="course-step"><div class="num">03 · RISK</div><h3>風險：我到底承擔什麼？</h3><p class="muted">集中、產業循環、利率、流動性與估值風險。</p></div><div class="course-step"><div class="num">04 · EVIDENCE</div><h3>Fact ≠ Analysis</h3><p class="muted">把可驗證資料與自己的推論分開，避免自我說服。</p></div><div class="course-step"><div class="num">05 · ALLOCATION</div><h3>資產配置</h3><p class="muted">先現金流與預備金，再決定股票、ETF、債券與現金比例。</p></div><div class="course-step"><div class="num">06 · 1M</div><h3>第一個 100 萬</h3><p class="muted">把收入、儲蓄率、持續投入與投資報酬串成可追蹤系統。</p></div><div class="course-step"><div class="num">07 · REVIEW</div><h3>投資複盤</h3><p class="muted">每月回頭檢查：當初的 Fact、Analysis、Risk 有沒有被新資料推翻。</p></div></div></section>`}

 $('app').innerHTML=`<section class="grid g4"><div class="metric"><div class="label">持倉成本</div><div class="num">${money(totalCost)}</div></div><div class="metric"><div class="label">目前市值</div><div class="num">${money(totalValue)}</div></div><div class="metric"><div class="label">未實現損益</div><div class="num ${pnl>=0?'up':'down'}">${pnl>=0?'+':''}${money(pnl)}</div></div><div class="metric"><div class="label">報酬率</div><div class="num ${pct>=0?'up':'down'}">${pct>=0?'+':''}${pct.toFixed(2)}%</div></div></section><section class="month-plan" style="margin-top:14px"><div class="card"><div class="section-title"><div><div class="section-kicker">SMART MONTHLY INVESTING</div><h3>📈 ${month} 投資執行</h3></div><button class="btn main" onclick="openInvestmentBuy()">＋ 記錄投資</button></div><div class="smart-grid" style="grid-template-columns:repeat(3,1fr)"><div class="smart-card"><div class="title">建議核心投入</div><div class="value">${money(coreTarget)}</div></div><div class="smart-card"><div class="title">本月已投入</div><div class="value">${money(snap.investment)}</div></div><div class="smart-card"><div class="title">還差</div><div class="value">${money(coreGap)}</div></div></div><div class="progress-line" style="margin-top:12px"><i style="width:${pctDone}%"></i></div><div class="smart-alert ${snap.saving<snap.plan.emergency?'warn':coreGap>0?'':'good'}" style="margin-top:12px"><b>${snap.saving<snap.plan.emergency?`先確認安全墊：本月建議存 ${money(snap.plan.emergency)}，目前已存 ${money(snap.saving)}。`:coreGap>0?`本月核心投入尚可執行 ${money(coreGap)}；是否買進仍要看研究與估值，不因「還差額度」追高。`:'本月核心投入已完成，不需要為了增加交易而硬買。'}</b></div></div><div class="card"><div class="section-kicker">THIS MONTH · MONEY MOVED</div><h3>本月錢流向哪裡</h3><div class="advice-list"><div class="advice-item"><span>存款／留存</span><b>${money(snap.saving)}</b></div><div class="advice-item"><span>投資</span><b>${money(snap.investment)}</b></div><div class="advice-item"><span>尚未配置</span><b>${money(snap.remaining)}</b></div></div><button class="btn soft" style="margin-top:10px" onclick="quickSaving('緊急預備金')">＋ 記錄存款</button></div></section><section class="card" style="margin-top:14px"><div class="section-title"><div><div class="section-kicker">MONTHLY TRANSACTIONS</div><h3>本月投了什麼</h3></div></div>${tx.length?tx.map(x=>{let p=parseInvNote(x.note);return`<div class="txn"><div>${esc((x.entry_date||'').slice(5,10))}</div><div class="symbol">${esc(p.symbol||x.category||'')}</div><div><b>${esc(x.category||'')}</b><div class="tiny">${esc(String(x.note||'').replace(/\[[^\]]+\]/g,'').trim())}</div></div><div class="amt" style="text-align:right;font-weight:900">${money(x.amount)}</div></div>`}).join(''):'<div class="empty">本月還沒有投資紀錄。按「記錄投資」即可同步到財務與持倉。</div>'}</section><section class="card" style="margin-top:14px"><div class="split"><div><div class="section-kicker">PORTFOLIO</div><h3>目前持倉</h3></div><button class="btn ghost" onclick="addHolding()">手動新增舊持倉</button></div><div class="scroll" style="margin-top:12px"><table class="table"><tr><th>標的</th><th>數量</th><th>均價</th><th>現價</th><th>市值</th><th>報酬</th><th>操作</th></tr>${rows||'<tr><td colspan="7" class="empty">尚無持倉</td></tr>'}</table></div></section>`
}
